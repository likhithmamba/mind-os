<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mind-OS | Imperial X</title>
    
    <!-- 1. STYLING -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cinzel:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #050404; /* Darker void */
        color: #f5f5f4; /* stone-100 */
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      /* Typography overrides */
      .font-display { font-family: 'Cinzel', serif; }
      .font-mono { font-family: 'JetBrains Mono', monospace; }
      
      /* Custom scrollbar */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #57534e; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #d97706; }
      
      /* High-End Glassmorphism */
      .glass-panel {
        background: rgba(12, 10, 9, 0.65);
        backdrop-filter: blur(24px) saturate(180%);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 
          0 4px 6px -1px rgba(0, 0, 0, 0.5),
          0 2px 4px -1px rgba(0, 0, 0, 0.3),
          inset 0 1px 0 rgba(255, 255, 255, 0.05);
      }
      
      .glass-card {
        background: rgba(28, 25, 23, 0.4);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.06);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        transition: all 0.3s ease;
      }

      .glass-card:hover {
        background: rgba(28, 25, 23, 0.6);
        border-color: rgba(255, 255, 255, 0.15);
        transform: translateY(-2px);
      }

      /* Animations */
      .layout-transition { transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
      
      /* Utilities */
      .custom-scrollbar::-webkit-scrollbar { width: 4px; }
      
      /* Text Shadows for readability */
      .text-glow { text-shadow: 0 0 20px rgba(245, 158, 11, 0.3); }

      /* --- VANGUARD MODE STYLES --- */
      .vanguard-bg {
          position: absolute;
          inset: 0;
          z-index: 0;
          background: 
              radial-gradient(circle at 20% 30%, rgba(30, 58, 138, 0.15) 0%, transparent 40%),
              radial-gradient(circle at 80% 70%, rgba(88, 28, 135, 0.1) 0%, transparent 40%);
          pointer-events: none;
      }

      .glass-panel-vanguard {
          background: rgba(15, 23, 42, 0.6);
          backdrop-filter: blur(16px);
          -webkit-backdrop-filter: blur(16px);
          border: 1px solid rgba(51, 65, 85, 0.5);
          box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      }

      .glow-red { box-shadow: 0 0 15px rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.3); }
      .glow-green { box-shadow: 0 0 15px rgba(34, 197, 94, 0.15); border-color: rgba(34, 197, 94, 0.3); }
    </style>

    <!-- 2. DEPENDENCIES (React 18 & Babel) -->
    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- 3. ICONS (Lucide React UMD) -->
    <script src="https://unpkg.com/lucide-react@0.263.1/dist/umd/lucide-react.min.js"></script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      /**
       * ------------------------------------------------------------------
       * GLOBAL IMPORTS & UTILITIES
       * ------------------------------------------------------------------
       */
      const { useState, useEffect, useRef, useMemo } = React;
      
      // Fix: Access lucideReact from window object
      const { 
        X, Save, Trash2, Calendar, CornerDownLeft, Maximize2, Minimize2, 
        Plus, ChevronLeft, ChevronRight, Filter, Zap, Sparkles, 
        Database, GripVertical, Check, Circle, Search,
        BookOpen, Rocket, Activity, Target, Shield, Trophy, Layout,
        Timer, Play, Pause, TrendingUp, CheckSquare
      } = window.lucideReact;

      // --- DATE & CALENDAR LOGIC ---
      const generateCalendar = (year, month) => {
        const firstDayOfMonth = new Date(year, month, 1);
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const startingDayIndex = firstDayOfMonth.getDay(); 
        
        const calendarCells = [];
        const prevMonthDays = new Date(year, month, 0).getDate();

        for (let i = startingDayIndex - 1; i >= 0; i--) {
          calendarCells.push({
            date: new Date(year, month - 1, prevMonthDays - i),
            isCurrentMonth: false,
            isToday: false,
          });
        }
        
        const today = new Date();
        for (let i = 1; i <= daysInMonth; i++) {
          const date = new Date(year, month, i);
          calendarCells.push({
            date: date,
            isCurrentMonth: true,
            isToday: date.toDateString() === today.toDateString(),
          });
        }
        
        const remainingCells = 42 - calendarCells.length;
        for (let i = 1; i <= remainingCells; i++) {
          calendarCells.push({
            date: new Date(year, month + 1, i),
            isCurrentMonth: false,
            isToday: false,
          });
        }
        
        return calendarCells;
      };

      const toISODate = (date) => {
        const offset = date.getTimezoneOffset();
        const d = new Date(date.getTime() - (offset*60*1000));
        return d.toISOString().split('T')[0];
      };

      const getRandomRecall = (nodes) => {
        if (nodes.length === 0) return null;
        const twoWeeksAgo = new Date();
        twoWeeksAgo.setDate(twoWeeksAgo.getDate() - 14);
        const oldNodes = nodes.filter(n => new Date(n.createdAt) < twoWeeksAgo);
        const pool = oldNodes.length > 0 ? oldNodes : nodes;
        return pool[Math.floor(Math.random() * pool.length)];
      };

      // --- LOCAL STORAGE MANAGER ---
      class StorageManager {
        static KEYS = { NODES: 'mind_os_nodes', HABITS: 'mind_os_habits' };

        static getStats(nodes) {
          let total = 0;
          for (const key in localStorage) {
            if (localStorage.hasOwnProperty(key)) {
              total += (localStorage[key].length + key.length) * 2;
            }
          }
          const sizeKB = total / 1024;
          const percent = Math.min(100, (sizeKB / 5120) * 100);
          return { usedKB: sizeKB.toFixed(2), percent, totalNodes: nodes.length };
        }

        static save(nodes, habits) {
          localStorage.setItem(this.KEYS.NODES, JSON.stringify(nodes));
          localStorage.setItem(this.KEYS.HABITS, JSON.stringify(habits));
        }

        static load() {
          const nodesStr = localStorage.getItem(this.KEYS.NODES);
          const habitsStr = localStorage.getItem(this.KEYS.HABITS);
          return {
            nodes: nodesStr ? JSON.parse(nodesStr) : [],
            habits: habitsStr ? JSON.parse(habitsStr) : {}
          };
        }
        
        static wipe() {
          localStorage.removeItem(this.KEYS.NODES);
          localStorage.removeItem(this.KEYS.HABITS);
        }
      }

      /**
       * ------------------------------------------------------------------
       * COMPONENTS
       * ------------------------------------------------------------------
       */

      // --- BUTTON COMPONENT ---
      const Button = ({ children, variant = 'primary', size = 'md', icon, className = '', ...props }) => {
        const baseStyle = "inline-flex items-center justify-center font-bold transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-stone-950 rounded-lg tracking-wide";
        const variants = {
          primary: "bg-amber-600 hover:bg-amber-500 text-white shadow-lg shadow-amber-900/20 border border-amber-500/20",
          secondary: "bg-stone-800 hover:bg-stone-700 text-stone-200 border border-stone-700",
          danger: "bg-red-900/20 hover:bg-red-900/40 text-red-300 border border-red-900/30",
          ghost: "bg-transparent hover:bg-stone-800/50 text-stone-400 hover:text-amber-400",
          zen: "bg-stone-900/50 hover:bg-stone-800 text-amber-500 border border-amber-900/30 hover:border-amber-500/50",
        };
        const sizes = {
          sm: "px-3 py-1.5 text-xs",
          md: "px-4 py-2 text-sm",
          lg: "px-6 py-3 text-base",
        };

        return (
          <button className={`${baseStyle} ${variants[variant]} ${sizes[size]} ${className}`} {...props}>
            {icon && <span className="mr-2">{icon}</span>}
            {children}
          </button>
        );
      };

      // --- VANGUARD VIEW COMPONENT (UPDATED 2.0) ---
      const VanguardView = () => {
        // State initialization
        const [logs, setLogs] = useState(() => {
          const saved = localStorage.getItem('vanguard_logs'); 
          return saved ? JSON.parse(saved) : [];
        });
        const [syllabus, setSyllabus] = useState(() => {
          const saved = localStorage.getItem('vanguard_syllabus');
          return saved ? JSON.parse(saved) : [];
        });
        const [examDate, setExamDate] = useState(() => localStorage.getItem('vanguard_exam') || '');
        const [selectedDate, setSelectedDate] = useState(new Date().toISOString().split('T')[0]);
        
        // Timer State
        const [timeLeft, setTimeLeft] = useState(1500); // 25 mins
        const [isActive, setIsActive] = useState(false);

        // Persistence
        useEffect(() => {
          localStorage.setItem('vanguard_logs', JSON.stringify(logs));
          localStorage.setItem('vanguard_syllabus', JSON.stringify(syllabus));
          localStorage.setItem('vanguard_exam', examDate);
        }, [logs, syllabus, examDate]);

        // Timer Logic
        useEffect(() => {
          let interval = null;
          if (isActive && timeLeft > 0) {
            interval = setInterval(() => setTimeLeft((prev) => prev - 1), 1000);
          } else if (timeLeft === 0) {
            setIsActive(false);
            alert("Focus session complete. Log your progress.");
          }
          return () => clearInterval(interval);
        }, [isActive, timeLeft]);

        const daysRemaining = useMemo(() => {
          if (!examDate) return "N/A";
          const diff = new Date(examDate).getTime() - new Date().getTime();
          return Math.ceil(diff / (1000 * 60 * 60 * 24));
        }, [examDate]);

        const currentLog = logs.find(l => l.date === selectedDate) || { date: selectedDate, revision: '', upskill: '', confidence: 1 };

        const saveLog = (field, val) => {
          const updatedLogs = [...logs];
          const idx = updatedLogs.findIndex(l => l.date === selectedDate);
          if (idx > -1) {
            updatedLogs[idx] = { ...updatedLogs[idx], [field]: val };
          } else {
            updatedLogs.push({ date: selectedDate, revision: '', upskill: '', confidence: 1, [field]: val });
          }
          setLogs(updatedLogs);
        };

        const addSyllabusItem = (text) => {
          if (!text.trim()) return;
          setSyllabus([...syllabus, { id: Date.now(), text, completed: false }]);
        };

        const toggleSyllabusItem = (id) => {
          setSyllabus(syllabus.map(s => s.id === id ? { ...s, completed: !s.completed } : s));
        };
        
        const deleteSyllabusItem = (id) => {
            setSyllabus(syllabus.filter(s => s.id !== id));
        };

        const formatTime = (seconds) => {
          const mins = Math.floor(seconds / 60);
          const secs = seconds % 60;
          return `${mins}:${secs.toString().padStart(2, '0')}`;
        };

        return (
          <div className="flex flex-col h-full w-full p-6 md:p-8 space-y-6 relative overflow-hidden">
              <div className="vanguard-bg"></div>

              {/* TOP HUD */}
              <div className="grid grid-cols-1 md:grid-cols-3 gap-6 shrink-0 relative z-10">
                  {/* Exam Countdown */}
                  <div className="glass-panel-vanguard rounded-2xl p-5 flex items-center justify-between border-l-4 border-l-indigo-500">
                      <div>
                          <p className="text-[10px] uppercase tracking-[0.2em] text-slate-400 font-bold mb-1">Exam Countdown</p>
                          <p className="text-3xl font-bold font-mono text-slate-100">{daysRemaining} DAYS</p>
                      </div>
                      <input 
                          type="date" 
                          value={examDate} 
                          onChange={e => setExamDate(e.target.value)} 
                          className="bg-slate-900/50 border border-slate-700 text-[10px] p-2 rounded text-slate-300 outline-none focus:border-indigo-500" 
                      />
                  </div>
                  
                  {/* Tactical Timer */}
                  <div className="glass-panel-vanguard rounded-2xl p-5 flex items-center justify-between">
                      <div>
                          <p className="text-[10px] uppercase tracking-[0.2em] text-slate-400 font-bold mb-1">Tactical Timer</p>
                          <div className="flex items-center gap-3">
                              <p className="text-3xl font-bold font-mono text-slate-100">{formatTime(timeLeft)}</p>
                              <Timer size={16} className="text-slate-500" />
                          </div>
                      </div>
                      <button 
                          onClick={() => setIsActive(!isActive)} 
                          className={`px-4 py-2 rounded-lg text-xs font-bold flex items-center gap-2 transition-all ${isActive ? 'bg-red-500/20 text-red-400 border border-red-500/30' : 'bg-green-500/20 text-green-400 border border-green-500/30'}`}
                      >
                          {isActive ? <Pause size={12} /> : <Play size={12} />}
                          {isActive ? 'PAUSE' : 'FOCUS'}
                      </button>
                  </div>

                  {/* Syllabus Mastery */}
                  <div className="glass-panel-vanguard rounded-2xl p-5 flex items-center justify-between border-r-4 border-r-emerald-500">
                      <div>
                          <p className="text-[10px] uppercase tracking-[0.2em] text-slate-400 font-bold mb-1">Syllabus Mastery</p>
                          <p className="text-3xl font-bold font-mono text-slate-100">
                              {Math.round((syllabus.filter(s => s.completed).length / (syllabus.length || 1)) * 100)}%
                          </p>
                      </div>
                      <TrendingUp size={32} className="text-emerald-500/50" />
                  </div>
              </div>

              {/* MAIN LAYOUT */}
              <div className="flex flex-1 gap-6 overflow-hidden relative z-10 flex-col md:flex-row">
                  
                  {/* LEFT: SYLLABUS */}
                  <div className="w-full md:w-72 glass-panel-vanguard rounded-2xl p-5 flex flex-col gap-4">
                      <h3 className="text-xs font-bold uppercase tracking-widest text-slate-400 flex items-center gap-2">
                          <CheckSquare size={14} /> Curriculum
                      </h3>
                      <input 
                          onKeyDown={e => {
                              if (e.key === 'Enter') {
                                  addSyllabusItem(e.currentTarget.value);
                                  e.currentTarget.value = '';
                              }
                          }}
                          placeholder="+ Add Topic..." 
                          className="bg-slate-900/50 border border-slate-700/50 rounded-lg p-3 text-xs outline-none focus:border-indigo-500 text-slate-300 placeholder-slate-600"
                      />
                      <div className="flex-1 overflow-y-auto custom-scrollbar space-y-2 pr-1">
                          {syllabus.map(item => (
                              <div key={item.id} className="flex items-center gap-3 group p-2.5 rounded-lg hover:bg-slate-800/40 transition-all border border-transparent hover:border-slate-800/50">
                                  <button 
                                      onClick={() => toggleSyllabusItem(item.id)}
                                      className={`w-4 h-4 rounded border flex items-center justify-center transition-colors ${item.completed ? 'bg-indigo-600 border-indigo-600' : 'border-slate-600 hover:border-indigo-500'}`}
                                  >
                                      {item.completed && <CheckSquare size={10} className="text-white" />}
                                  </button>
                                  <span className={`text-xs truncate flex-1 font-medium ${item.completed ? 'line-through opacity-40 text-slate-500' : 'text-slate-300'}`}>
                                      {item.text}
                                  </span>
                                   <button 
                                      onClick={() => deleteSyllabusItem(item.id)}
                                      className="opacity-0 group-hover:opacity-100 text-slate-600 hover:text-red-400 transition-opacity"
                                  >
                                      <Trash2 size={12} />
                                  </button>
                              </div>
                          ))}
                          {syllabus.length === 0 && (
                              <div className="text-center py-10 opacity-30 text-[10px] uppercase tracking-widest text-slate-500">No Topics Added</div>
                          )}
                      </div>
                  </div>

                  {/* CENTER: DAILY DEPLOYMENT */}
                  <div className="flex-1 glass-panel-vanguard rounded-2xl p-6 flex flex-col gap-6 overflow-y-auto custom-scrollbar">
                      <div className="flex justify-between items-center border-b border-slate-800/50 pb-4">
                          <div>
                              <div className="flex items-center gap-2 text-indigo-400 mb-1">
                                  <Activity size={14} />
                                  <span className="text-[10px] font-mono uppercase tracking-widest">Log Date</span>
                              </div>
                              <h2 className="text-2xl font-bold tracking-tight text-white">{selectedDate}</h2>
                          </div>
                          <div className="flex gap-1">
                              {[1,2,3,4,5].map(n => (
                                  <button 
                                      key={n} 
                                      onClick={() => saveLog('confidence', n)} 
                                      className={`w-8 h-8 text-xs font-mono font-bold rounded-lg border transition-all ${currentLog.confidence >= n ? 'bg-indigo-600 border-indigo-500 text-white shadow-lg shadow-indigo-500/20' : 'border-slate-800 text-slate-600 bg-slate-900/30'}`}
                                  >
                                      {n}
                                  </button>
                              ))}
                          </div>
                      </div>

                      <div className="grid grid-cols-1 gap-6 flex-1 min-h-0">
                          <div className="space-y-3 flex flex-col h-1/2">
                              <label className="text-[10px] uppercase font-bold text-slate-500 flex items-center gap-2">
                                  <BookOpen size={12} /> Exam Revision Topics
                              </label>
                              <textarea 
                                  value={currentLog.revision}
                                  onChange={e => saveLog('revision', e.target.value)}
                                  className="flex-1 w-full bg-slate-900/50 rounded-xl p-4 text-sm border border-slate-800/60 outline-none focus:border-indigo-500/50 focus:bg-slate-900/80 transition-all text-slate-300 placeholder-slate-700 resize-none leading-relaxed"
                                  placeholder="Specific formulas, chapters, or mock tests..."
                              ></textarea>
                          </div>
                          <div className="space-y-3 flex flex-col h-1/2">
                              <label className="text-[10px] uppercase font-bold text-slate-500 flex items-center gap-2">
                                  <Rocket size={12} /> Skill Upskilling (Growth)
                              </label>
                              <textarea 
                                  value={currentLog.upskill}
                                  onChange={e => saveLog('upskill', e.target.value)}
                                  className="flex-1 w-full bg-slate-900/50 rounded-xl p-4 text-sm border border-slate-800/60 outline-none focus:border-emerald-500/50 focus:bg-slate-900/80 transition-all text-slate-300 placeholder-slate-700 resize-none leading-relaxed"
                                  placeholder="New tech, projects, or coding practice..."
                              ></textarea>
                          </div>
                      </div>
                  </div>

                  {/* RIGHT: TIMELINE SELECTOR */}
                  <div className="w-20 glass-panel-vanguard rounded-2xl flex flex-col items-center p-2 gap-2 overflow-y-auto custom-scrollbar">
                      {Array.from({length: 40}).map((_, i) => {
                          const d = new Date(); 
                          d.setDate(d.getDate() - 10 + i);
                          const ds = d.toISOString().split('T')[0];
                          const hasLog = logs.some(l => l.date === ds);
                          const isSelected = selectedDate === ds;
                          return (
                              <button 
                                  key={ds} 
                                  onClick={() => setSelectedDate(ds)} 
                                  className={`w-full py-3 rounded-xl flex flex-col items-center transition-all duration-300 ${isSelected ? 'bg-indigo-600 text-white shadow-lg' : 'hover:bg-slate-800/40 opacity-50 hover:opacity-100 text-slate-400'}`}
                              >
                                  <span className="text-[8px] uppercase font-mono font-bold tracking-wider">{d.toLocaleString('default', {month:'short'})}</span>
                                  <span className="text-sm font-bold font-mono">{d.getDate()}</span>
                                  {hasLog && <div className={`w-1 h-1 rounded-full mt-1 ${isSelected ? 'bg-white' : 'bg-indigo-500'}`}></div>}
                              </button>
                          );
                      })}
                  </div>
              </div>
          </div>
        );
      };

      // --- MOUNT ROOT ---
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
